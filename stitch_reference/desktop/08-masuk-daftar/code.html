<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RuangAksara - Masuk</title>
  <!-- Google Fonts: Lora & Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            lora: ['Lora', 'serif'],
            nunito: ['Nunito', 'sans-serif'],
          },
          colors: {
            brand: {
              primary: '#2A6B65',
              'primary-dark': '#1F524D',
              'primary-light': '#D4EBE8',
              secondary: '#5A829A',
              sand: '#D4A373',
              'sand-dark': '#4A3728',
              bg: '#F5F9F8',
              surface: '#FFFFFF',
              dark: '#1A3331',
              muted: '#5A7A76',
              rose: '#E8B4B0',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #F5F9F8;
      font-family: 'Nunito', sans-serif;
      color: #1A3331;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }
    .blur-orb-1 {
      position: absolute;
      width: 420px;
      height: 420px;
      top: -80px;
      left: -100px;
      background: radial-gradient(circle, rgba(42, 107, 101, 0.18) 0%, rgba(212, 235, 232, 0.05) 70%, transparent 100%);
      filter: blur(50px);
      border-radius: 9999px;
      pointer-events: none;
      z-index: 0;
    }
    .blur-orb-2 {
      position: absolute;
      width: 380px;
      height: 380px;
      bottom: -60px;
      right: -80px;
      background: radial-gradient(circle, rgba(212, 163, 115, 0.2) 0%, rgba(245, 249, 248, 0.05) 70%, transparent 100%);
      filter: blur(50px);
      border-radius: 9999px;
      pointer-events: none;
      z-index: 0;
    }
    .login-card {
      background: #FFFFFF;
      border: 1px solid rgba(42, 107, 101, 0.08);
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(42, 107, 101, 0.08), 0 4px 12px rgba(26, 51, 49, 0.03);
    }
  </style>
</head>
<body class="bg-brand-bg flex items-center justify-center p-4 selection:bg-brand-primary-light selection:text-brand-dark">

  <!-- Subtle Ambient Blurred Orbs -->
  <div class="blur-orb-1"></div>
  <div class="blur-orb-2"></div>

  <!-- Main Container -->
  <main class="w-full max-w-[400px] relative z-10 my-auto py-8">
    
    <!-- Top Back / Brand minimal header -->
    <div class="flex items-center justify-between mb-6 px-1">
      <a href="javascript:history.back()" class="inline-flex items-center gap-1.5 text-xs font-semibold text-brand-muted hover:text-brand-primary transition-colors py-1 px-2.5 rounded-full hover:bg-brand-primary-light/50">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        <span>Kembali ke Beranda</span>
      </a>
      <span class="text-xs text-brand-muted font-medium">RuangAksara</span>
    </div>

    <!-- Center Card -->
    <div class="login-card p-7 sm:p-8">
      
      <!-- Icon Book Header -->
      <div class="flex justify-center mb-5">
        <div class="w-12 h-12 rounded-2xl bg-brand-primary-light/70 flex items-center justify-center text-brand-primary border border-brand-primary/10 shadow-sm">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
          </svg>
        </div>
      </div>

      <!-- Heading & Subtext -->
      <div class="text-center mb-6">
        <h1 class="font-lora text-2xl font-bold text-brand-dark tracking-tight mb-1.5">
          Selamat datang kembali
        </h1>
        <p class="font-nunito text-sm text-brand-muted">
          Rak bukumu sudah menunggumu.
        </p>
      </div>

      <!-- Login Form -->
      <form action="#" method="POST" class="space-y-4" onsubmit="event.preventDefault();">
        
        <!-- Input 1: Email -->
        <div>
          <label for="email" class="block text-xs font-semibold text-brand-dark mb-1.5">
            Email
          </label>
          <div class="relative">
            <input 
              type="email" 
              id="email" 
              name="email"
              placeholder="nama@surel.com" 
              value="vana@email.com"
              required
              class="w-full h-12 px-4 text-sm font-nunito bg-white text-brand-dark border border-brand-dark/15 rounded-[12px] placeholder:text-brand-muted/60 focus:outline-none focus:border-brand-primary focus:ring-2 focus:ring-brand-primary-light transition-all"
            >
          </div>
        </div>

        <!-- Input 2: Kata Sandi with Show/Hide Toggle -->
        <div>
          <label for="password" class="block text-xs font-semibold text-brand-dark mb-1.5">
            Kata sandi
          </label>
          <div class="relative">
            <input 
              type="password" 
              id="password" 
              name="password"
              placeholder="••••••••" 
              value="rahasiabuku2024"
              required
              class="w-full h-12 pl-4 pr-11 text-sm font-nunito bg-white text-brand-dark border border-brand-dark/15 rounded-[12px] placeholder:text-brand-muted/60 focus:outline-none focus:border-brand-primary focus:ring-2 focus:ring-brand-primary-light transition-all"
            >
            <button 
              type="button" 
              id="togglePassword" 
              aria-label="Lihat kata sandi" 
              class="absolute right-3.5 top-1/2 -translate-y-1/2 text-brand-muted hover:text-brand-primary p-1 focus:outline-none transition-colors"
              onclick="const pwd = document.getElementById('password'); const icon = document.getElementById('eyeIcon'); if(pwd.type === 'password'){ pwd.type='text'; icon.innerHTML = '<path stroke-linecap=\'round\' stroke-linejoin=\'round\' stroke-width=\'1.8\' d=\'M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18\'/>'; } else { pwd.type='password'; icon.innerHTML = '<path stroke-linecap=\'round\' stroke-linejoin=\'round\' stroke-width=\'1.8\' d=\'M15 12a3 3 0 11-6 0 3 3 0 016 0z\'/><path stroke-linecap=\'round\' stroke-linejoin=\'round\' stroke-width=\'1.8\' d=\'M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z\'/>'; }"
            >
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Forgot Password Link -->
        <div class="flex justify-end pt-0.5">
          <a href="#" class="text-xs font-semibold text-brand-primary hover:text-brand-primary-dark hover:underline transition-colors">
            Lupa kata sandi?
          </a>
        </div>

        <!-- Submit Button: Masuk -->
        <div class="pt-2">
          <button 
            type="submit" 
            class="w-full h-11 bg-brand-primary hover:bg-brand-primary-dark text-brand-bg font-nunito font-semibold text-sm rounded-full shadow-md shadow-brand-primary/20 hover:shadow-brand-primary/30 transform active:scale-[0.99] transition-all flex items-center justify-center gap-2"
          >
            <span>Masuk</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </button>
        </div>

      </form>

      <!-- Divider -->
      <div class="relative my-6 text-center">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-brand-dark/10"></div>
        </div>
        <span class="relative px-3 bg-white text-[11px] font-medium text-brand-muted uppercase tracking-wider">
          atau
        </span>
      </div>

      <!-- Quick Social / Guest Entry -->
      <button 
        type="button" 
        class="w-full h-10 bg-brand-bg hover:bg-brand-primary-light/40 text-brand-dark border border-brand-dark/10 font-nunito font-medium text-xs rounded-full transition-all flex items-center justify-center gap-2 mb-2"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-brand-secondary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
        <span>Jelajah sebagai Tamu</span>
      </button>

      <!-- Footer: Register Switch -->
      <div class="text-center mt-6 pt-2 border-t border-brand-dark/5">
        <p class="text-xs text-brand-muted font-medium">
          Belum punya akun? 
          <a href="#" class="font-bold text-brand-primary hover:text-brand-primary-dark hover:underline ml-1">
            Daftar
          </a>
        </p>
      </div>

    </div>

    <!-- Security & Warm Note -->
    <div class="text-center mt-5 text-[11px] text-brand-muted/70 flex items-center justify-center gap-3">
      <span>Privasi Terjaga</span>
      <span>•</span>
      <span>Komunitas Ramah</span>
      <span>•</span>
      <span>Bantuan</span>
    </div>

  </main>

</body>
</html>
